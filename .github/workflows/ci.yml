name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/DocAssistant.Tests/DocAssistant.Tests.csproj

      - name: Build
        run: dotnet build tests/DocAssistant.Tests/DocAssistant.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/DocAssistant.Tests/DocAssistant.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t docassistant-api ./src/DocAssistant.Api

      - name: Build web image
        run: docker build -t docassistant-web ./web
